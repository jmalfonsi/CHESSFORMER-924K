[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chessformer-mini"
version = "0.1.0"
description = "CHESSFORMER-924K: sub-million-parameter single-forward chess models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.2",
  "python-chess==1.999",
  "torch==2.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
modal = ["modal>=1.1,<2"]
training = ["zstandard>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]
